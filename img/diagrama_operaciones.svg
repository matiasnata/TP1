<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="620" fill="#15161a"/>
  <rect x="10" y="10" width="980" height="600" fill="none" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Start -->
  <circle cx="500" cy="45" r="14" fill="none" stroke="#ffffff" stroke-width="2"/>
  <line x1="500" y1="59" x2="500" y2="73" stroke="#ffffff" stroke-width="1.8" marker-end="url(#arrow2)"/>

  <!-- Diamond: que comando -->
  <polygon points="500,75 660,150 500,225 340,150" fill="none" stroke="#ffffff" stroke-width="1.8"/>
  <text x="500" y="145" fill="#ffffff" font-size="14" text-anchor="middle">¿Qué comando</text>
  <text x="500" y="163" fill="#ffffff" font-size="14" text-anchor="middle">se recibió?</text>

  <!-- 4 lineas desde el rombo hacia cada caja -->
  <line x1="500" y1="225" x2="130" y2="278" stroke="#ffffff" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <line x1="500" y1="225" x2="380" y2="278" stroke="#ffffff" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <line x1="500" y1="225" x2="620" y2="278" stroke="#ffffff" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <line x1="500" y1="225" x2="870" y2="278" stroke="#ffffff" stroke-width="1.6" marker-end="url(#arrow2)"/>

  <!-- Etiquetas de los comandos -->
  <text x="255" y="240" fill="#ffffff" font-size="13" text-anchor="middle">buscar-nombre</text>
  <text x="410" y="258" fill="#ffffff" font-size="13" text-anchor="middle">mostrar-uno</text>
  <text x="590" y="258" fill="#ffffff" font-size="13" text-anchor="middle">mostrar-todo</text>
  <text x="745" y="240" fill="#ffffff" font-size="13" text-anchor="middle">mostrar-rarezas</text>

  <!-- Cajas de accion -->
  <rect x="30" y="280" width="200" height="60" rx="3" fill="none" stroke="#ffffff" stroke-width="1.8"/>
  <text x="130" y="304" fill="#ffffff" font-size="13" text-anchor="middle">Buscar el pokemon</text>
  <text x="130" y="322" fill="#ffffff" font-size="13" text-anchor="middle">por su nombre</text>

  <rect x="280" y="280" width="200" height="60" rx="3" fill="none" stroke="#ffffff" stroke-width="1.8"/>
  <text x="380" y="304" fill="#ffffff" font-size="13" text-anchor="middle">Elegir un pokemon</text>
  <text x="380" y="322" fill="#ffffff" font-size="13" text-anchor="middle">al azar</text>

  <rect x="520" y="280" width="200" height="60" rx="3" fill="none" stroke="#ffffff" stroke-width="1.8"/>
  <text x="620" y="304" fill="#ffffff" font-size="13" text-anchor="middle">Recorrer todos, en</text>
  <text x="620" y="322" fill="#ffffff" font-size="13" text-anchor="middle">orden alfabético</text>

  <rect x="770" y="280" width="200" height="60" rx="3" fill="none" stroke="#ffffff" stroke-width="1.8"/>
  <text x="870" y="299" fill="#ffffff" font-size="13" text-anchor="middle">Recorrer agrupados</text>
  <text x="870" y="315" fill="#ffffff" font-size="13" text-anchor="middle">por rareza (y alfabético</text>
  <text x="870" y="331" fill="#ffffff" font-size="13" text-anchor="middle">dentro de cada grupo)</text>

  <!-- Bus de convergencia -->
  <line x1="130" y1="340" x2="130" y2="400" stroke="#ffffff" stroke-width="1.6"/>
  <line x1="380" y1="340" x2="380" y2="400" stroke="#ffffff" stroke-width="1.6"/>
  <line x1="620" y1="340" x2="620" y2="400" stroke="#ffffff" stroke-width="1.6"/>
  <line x1="870" y1="340" x2="870" y2="400" stroke="#ffffff" stroke-width="1.6"/>
  <line x1="130" y1="400" x2="870" y2="400" stroke="#ffffff" stroke-width="1.6"/>
  <line x1="500" y1="400" x2="500" y2="418" stroke="#ffffff" stroke-width="1.8" marker-end="url(#arrow2)"/>

  <!-- Parallelogram: mostrar resultado -->
  <polygon points="390,420 640,420 610,480 360,480" fill="none" stroke="#ffffff" stroke-width="1.8"/>
  <text x="500" y="445" fill="#ffffff" font-size="14" text-anchor="middle">Mostrar resultado</text>
  <text x="500" y="463" fill="#ffffff" font-size="14" text-anchor="middle">por pantalla</text>

  <!-- End -->
  <line x1="500" y1="480" x2="500" y2="518" stroke="#ffffff" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <circle cx="500" cy="535" r="15" fill="none" stroke="#ffffff" stroke-width="2"/>
  <circle cx="500" cy="535" r="9" fill="#ffffff"/>
</svg>
