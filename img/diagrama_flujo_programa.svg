<svg viewBox="0 0 760 700" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="700" fill="#15161a"/>
  <rect x="10" y="10" width="740" height="680" fill="none" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Start -->
  <circle cx="230" cy="55" r="14" fill="none" stroke="#ffffff" stroke-width="2"/>

  <!-- Box 1: leer linea -->
  <rect x="110" y="95" width="240" height="55" rx="3" fill="none" stroke="#ffffff" stroke-width="1.8"/>
  <text x="230" y="118" fill="#ffffff" font-size="14" text-anchor="middle">Leer la siguiente línea</text>
  <text x="230" y="136" fill="#ffffff" font-size="14" text-anchor="middle">del archivo</text>

  <!-- Diamond 1: quedan lineas -->
  <polygon points="230,190 335,255 230,320 125,255" fill="none" stroke="#ffffff" stroke-width="1.8"/>
  <text x="230" y="250" fill="#ffffff" font-size="13" text-anchor="middle">¿Quedan líneas</text>
  <text x="230" y="266" fill="#ffffff" font-size="13" text-anchor="middle">por leer?</text>

  <!-- Diamond 2: valida y no repetida -->
  <polygon points="230,390 340,458 230,526 120,458" fill="none" stroke="#ffffff" stroke-width="1.8"/>
  <text x="230" y="450" fill="#ffffff" font-size="13" text-anchor="middle">¿Es válida y</text>
  <text x="230" y="466" fill="#ffffff" font-size="13" text-anchor="middle">no repetida?</text>

  <!-- Box 3: agregar -->
  <rect x="110" y="576" width="240" height="60" rx="3" fill="none" stroke="#ffffff" stroke-width="1.8"/>
  <text x="230" y="600" fill="#ffffff" font-size="14" text-anchor="middle">Agregar a la pokédex</text>
  <text x="230" y="618" fill="#ffffff" font-size="14" text-anchor="middle">(ordenada alfabéticamente)</text>

  <!-- Box 2: ejecutar comando -->
  <rect x="470" y="228" width="230" height="55" rx="3" fill="none" stroke="#ffffff" stroke-width="1.8"/>
  <text x="585" y="251" fill="#ffffff" font-size="14" text-anchor="middle">Ejecutar el comando</text>
  <text x="585" y="269" fill="#ffffff" font-size="14" text-anchor="middle">indicado</text>

  <!-- Parallelogram: mostrar resultado -->
  <polygon points="500,335 700,335 670,395 470,395" fill="none" stroke="#ffffff" stroke-width="1.8"/>
  <text x="585" y="360" fill="#ffffff" font-size="14" text-anchor="middle">Mostrar resultado</text>
  <text x="585" y="378" fill="#ffffff" font-size="14" text-anchor="middle">por pantalla</text>

  <!-- End -->
  <circle cx="585" cy="450" r="15" fill="none" stroke="#ffffff" stroke-width="2"/>
  <circle cx="585" cy="450" r="9" fill="#ffffff"/>

  <!-- Arrows -->
  <line x1="230" y1="69" x2="230" y2="93" stroke="#ffffff" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="230" y1="150" x2="230" y2="188" stroke="#ffffff" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="230" y1="320" x2="230" y2="388" stroke="#ffffff" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="248" y="352" fill="#ffffff" font-size="13">Sí</text>

  <line x1="230" y1="526" x2="230" y2="574" stroke="#ffffff" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="248" y="556" fill="#ffffff" font-size="13">Sí</text>

  <!-- No branch diamond1 -> ejecutar comando -->
  <line x1="335" y1="255" x2="468" y2="255" stroke="#ffffff" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="390" y="245" fill="#ffffff" font-size="13">No</text>

  <line x1="585" y1="283" x2="585" y2="333" stroke="#ffffff" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="585" y1="395" x2="585" y2="433" stroke="#ffffff" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- No branch diamond2 -> vuelve a leer linea (loop izquierdo) -->
  <polyline points="120,458 40,458 40,122 108,122" fill="none" stroke="#ffffff" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="46" y="290" fill="#ffffff" font-size="13">No</text>

  <!-- agregar -> vuelve a leer linea (loop derecho) -->
  <polyline points="350,606 420,606 420,122 352,122" fill="none" stroke="#ffffff" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>
