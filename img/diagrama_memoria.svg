<svg viewBox="0 0 1300 800" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1300" height="800" fill="#0d0e12"/>

  <!-- Encabezados -->
  <text x="150" y="55" fill="#5b8def" font-size="30" font-weight="bold" text-anchor="middle">stack</text>
  <text x="750" y="55" fill="#3ddc97" font-size="30" font-weight="bold" text-anchor="middle">heap</text>
  <line x1="280" y1="80" x2="280" y2="780" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="6,6"/>

  <!-- STACK: variable local tp1 -->
  <rect x="70" y="185" width="160" height="60" rx="6" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="150" y="220" fill="#ffffff" font-size="17" text-anchor="middle">tp1</text>

  <!-- Leyenda de puntero -->
  <rect x="70" y="700" width="16" height="16" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="78" cy="708" r="3" fill="#ffffff"/>
  <text x="98" y="713" fill="#ffffff" font-size="14">= puntero (dirección a otro bloque de memoria)</text>

  <!-- Arrow stack -> struct tp1 -->
  <line x1="230" y1="215" x2="326" y2="215" stroke="#ffffff" stroke-width="1.8" marker-end="url(#arrowm)"/>

  <!-- HEAP nivel 1: struct tp1 -->
  <rect x="330" y="140" width="260" height="200" rx="6" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="460" y="163" fill="#9aa0a6" font-size="13" text-anchor="middle" font-style="italic">struct tp1</text>
  <line x1="330" y1="175" x2="590" y2="175" stroke="#ffffff" stroke-width="1"/>

  <text x="348" y="207" fill="#ffffff" font-size="15">pokemones</text>
  <rect x="548" y="197" width="16" height="16" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="556" cy="205" r="3" fill="#ffffff"/>

  <line x1="330" y1="225" x2="590" y2="225" stroke="#ffffff" stroke-width="1"/>
  <text x="348" y="252" fill="#ffffff" font-size="15">cantidad = 3</text>

  <line x1="330" y1="272" x2="590" y2="272" stroke="#ffffff" stroke-width="1"/>
  <text x="348" y="299" fill="#ffffff" font-size="15">capacidad = 4</text>

  <!-- Arrow struct tp1.pokemones -> arreglo -->
  <polyline points="564,205 640,205 640,260 676,260" fill="none" stroke="#ffffff" stroke-width="1.8" marker-end="url(#arrowm)"/>

  <!-- HEAP nivel 2: arreglo de struct pokemon -->
  <rect x="680" y="140" width="560" height="330" rx="10" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="960" y="163" fill="#9aa0a6" font-size="13" text-anchor="middle" font-style="italic">arreglo de struct pokemon (capacidad = 4)</text>

  <!-- Slot 0: Azumarill -->
  <rect x="700" y="178" width="520" height="55" rx="4" fill="none" stroke="#ffffff" stroke-width="1.6"/>
  <text x="712" y="200" fill="#ffffff" font-size="13">[0] nombre</text>
  <rect x="800" y="192" width="14" height="14" fill="none" stroke="#ffffff" stroke-width="1.4"/>
  <circle cx="807" cy="199" r="2.6" fill="#ffffff"/>
  <line x1="828" y1="178" x2="828" y2="233" stroke="#ffffff" stroke-width="1"/>
  <text x="712" y="222" fill="#ffffff" font-size="12">velocidad = 50</text>
  <text x="848" y="200" fill="#ffffff" font-size="12">peso = 10.0</text>
  <text x="848" y="222" fill="#ffffff" font-size="12">rareza = C</text>
  <line x1="985" y1="178" x2="985" y2="233" stroke="#ffffff" stroke-width="1"/>
  <text x="1000" y="210" fill="#9aa0a6" font-size="11">(orden alfabético)</text>

  <!-- Slot 1: Lapras -->
  <rect x="700" y="238" width="520" height="55" rx="4" fill="none" stroke="#ffffff" stroke-width="1.6"/>
  <text x="712" y="260" fill="#ffffff" font-size="13">[1] nombre</text>
  <rect x="800" y="252" width="14" height="14" fill="none" stroke="#ffffff" stroke-width="1.4"/>
  <circle cx="807" cy="259" r="2.6" fill="#ffffff"/>
  <line x1="828" y1="238" x2="828" y2="293" stroke="#ffffff" stroke-width="1"/>
  <text x="712" y="282" fill="#ffffff" font-size="12">velocidad = 30</text>
  <text x="848" y="260" fill="#ffffff" font-size="12">peso = 50.3</text>
  <text x="848" y="282" fill="#ffffff" font-size="12">rareza = R</text>

  <!-- Slot 2: Magikarp -->
  <rect x="700" y="298" width="520" height="55" rx="4" fill="none" stroke="#ffffff" stroke-width="1.6"/>
  <text x="712" y="320" fill="#ffffff" font-size="13">[2] nombre</text>
  <rect x="800" y="312" width="14" height="14" fill="none" stroke="#ffffff" stroke-width="1.4"/>
  <circle cx="807" cy="319" r="2.6" fill="#ffffff"/>
  <line x1="828" y1="298" x2="828" y2="353" stroke="#ffffff" stroke-width="1"/>
  <text x="712" y="342" fill="#ffffff" font-size="12">velocidad = 10</text>
  <text x="848" y="320" fill="#ffffff" font-size="12">peso = 5.2</text>
  <text x="848" y="342" fill="#ffffff" font-size="12">rareza = C</text>

  <!-- Slot 3: reservado -->
  <rect x="700" y="358" width="520" height="55" rx="4" fill="none" stroke="#5a5f66" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="850" y="390" fill="#5a5f66" font-size="13">[3] reservado (capacidad &gt; cantidad, sin usar)</text>

  <!-- Arrows nombre -> strings, enrutadas por un canal limpio -->
  <polyline points="814,199 824,199 824,490 750,560" fill="none" stroke="#ffffff" stroke-width="1.6" marker-end="url(#arrowm)"/>
  <polyline points="814,259 829,259 829,490 960,560" fill="none" stroke="#ffffff" stroke-width="1.6" marker-end="url(#arrowm)"/>
  <polyline points="814,319 834,319 834,490 1170,560" fill="none" stroke="#ffffff" stroke-width="1.6" marker-end="url(#arrowm)"/>

  <!-- HEAP nivel 3: strings -->
  <rect x="660" y="565" width="180" height="42" rx="4" fill="none" stroke="#ffffff" stroke-width="1.6"/>
  <text x="750" y="591" fill="#ffffff" font-size="14" text-anchor="middle" font-family="monospace">"Azumarill\0"</text>

  <rect x="880" y="565" width="160" height="42" rx="4" fill="none" stroke="#ffffff" stroke-width="1.6"/>
  <text x="960" y="591" fill="#ffffff" font-size="14" text-anchor="middle" font-family="monospace">"Lapras\0"</text>

  <rect x="1080" y="565" width="180" height="42" rx="4" fill="none" stroke="#ffffff" stroke-width="1.6"/>
  <text x="1170" y="591" fill="#ffffff" font-size="14" text-anchor="middle" font-family="monospace">"Magikarp\0"</text>

  <text x="960" y="650" fill="#9aa0a6" font-size="13" text-anchor="middle">Cada nombre es una reserva de memoria independiente (malloc propio),</text>
  <text x="960" y="670" fill="#9aa0a6" font-size="13" text-anchor="middle">por eso tp1_destruir debe liberar cada uno antes de liberar el arreglo.</text>
</svg>
